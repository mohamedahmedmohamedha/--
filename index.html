<title>دار مها — إدارة البيت الذكية</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --text:#1d2433; --muted:#718096; --border:#e7ebf2;
  --primary:#2463eb; --primary2:#1849b8; --ok:#16834b; --warn:#b46b00; --danger:#c43d4b;
  --soft:#f0f4ff; --shadow:0 10px 30px rgba(31,43,75,.07); --radius:18px;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.55}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--card);border-left:1px solid var(--border);padding:18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:8px 6px 15px;border-bottom:1px solid var(--border)}
.brand .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--primary),#62a0ff);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800}
.brand h1{font-size:18px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px}
.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;padding:11px 12px;border-radius:12px;text-align:right;color:#4d5a70}.nav button.active,.nav button:hover{background:var(--soft);color:var(--primary);font-weight:700}
.side-bottom{margin-top:auto;display:grid;gap:7px}.mini-btn{border:1px solid var(--border);background:#fff;border-radius:11px;padding:9px;text-align:right;color:#59667a}
.main{padding:22px;min-width:0}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.topbar h2{margin:0;font-size:26px}.month-pick{display:flex;align-items:center;gap:8px}
.month-pick button,.month-pick input{height:40px;border:1px solid var(--border);background:#fff;border-radius:11px;padding:0 12px}.month-pick input{width:155px}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:27px;font-weight:800;margin-top:7px}.stat .sub{font-size:12px;color:var(--muted);margin-top:3px}
.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.section-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.section-head h3{margin:0;font-size:17px}.linkbtn{border:0;background:transparent;color:var(--primary);font-weight:700}
.progress{height:10px;background:#edf1f7;border-radius:20px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--primary),#72a3ff);border-radius:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.row-main{min-width:0}.row-title{font-weight:700}.row-sub{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}.b-essential{background:#e8f7ef;color:var(--ok)}.b-extra{background:#fff4df;color:var(--warn)}.b-emergency{background:#ffe8eb;color:var(--danger)}.b-income{background:#eaf2ff;color:var(--primary)}
.actions{display:flex;gap:6px;flex-wrap:wrap}.iconbtn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:7px 9px;color:#59667a}.iconbtn:hover{border-color:#c9d5ee;color:var(--primary)}

/* ===== Premium motion & polish ===== */
:root{
  --glow:rgba(36,99,235,.16);
  --glow2:rgba(98,160,255,.11);
  --surface-soft:rgba(255,255,255,.78);
}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 8% 8%,rgba(98,160,255,.13),transparent 24rem),
    radial-gradient(circle at 92% 18%,rgba(36,99,235,.08),transparent 28rem),
    linear-gradient(180deg,#f8faff 0%,#f4f7fb 55%,#f1f5fa 100%);
}
body::before,body::after{
  content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(12px);opacity:.7;
}
body::before{width:280px;height:280px;left:-90px;top:20%;background:radial-gradient(circle,rgba(98,160,255,.18),transparent 70%);animation:floatBlobA 14s ease-in-out infinite alternate}
body::after{width:340px;height:340px;right:-120px;bottom:4%;background:radial-gradient(circle,rgba(36,99,235,.12),transparent 70%);animation:floatBlobB 18s ease-in-out infinite alternate}
.app{position:relative;grid-template-columns:252px minmax(0,1fr);animation:appIn .65s cubic-bezier(.2,.75,.2,1) both}
.sidebar{
  background:linear-gradient(180deg,rgba(255,255,255,.93),rgba(249,251,255,.88));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:inset -1px 0 rgba(255,255,255,.5),12px 0 50px rgba(44,62,96,.04);
}
.sidebar::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(180deg,#2463eb, #72a3ff, transparent);opacity:.75}
.brand{transition:transform .35s ease,background .35s ease}
.brand:hover{transform:translateY(-2px)}
.brand .logo{box-shadow:0 10px 26px rgba(36,99,235,.2),inset 0 1px rgba(255,255,255,.4);animation:logoPulse 4s ease-in-out infinite}
.nav button{position:relative;overflow:hidden;transition:transform .25s ease,background .25s ease,color .25s ease,box-shadow .25s ease}
.nav button::after{content:"";position:absolute;inset:auto 10px 0;height:2px;border-radius:999px;background:linear-gradient(90deg,transparent,#2463eb,transparent);transform:scaleX(0);transition:transform .3s ease}
.nav button:hover{transform:translateX(-3px)}
.nav button.active{box-shadow:0 8px 18px rgba(36,99,235,.08);transform:translateX(-2px)}
.nav button.active::after{transform:scaleX(1)}
.main{position:relative;padding:24px clamp(16px,2.3vw,32px) 34px;isolation:isolate}
.topbar{position:sticky;top:0;z-index:20;padding:6px 0 16px;margin-bottom:2px;background:linear-gradient(180deg,rgba(245,247,251,.96) 60%,rgba(245,247,251,0));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar h2{letter-spacing:-.35px;animation:titleIn .55s .05s both}
.month-pick{animation:toolsIn .55s .12s both}
.card{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.9));
  box-shadow:0 14px 40px rgba(31,43,75,.055),0 2px 8px rgba(31,43,75,.035);
  transition:transform .32s cubic-bezier(.2,.75,.2,1),box-shadow .32s ease,border-color .32s ease;
  animation:cardIn .62s cubic-bezier(.2,.75,.2,1) both;
}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.6),transparent 34%);opacity:.7}
.card::after{content:"";position:absolute;top:-70px;left:-70px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(98,160,255,.09),transparent 68%);pointer-events:none;transition:transform .7s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 54px rgba(31,43,75,.09),0 4px 12px rgba(31,43,75,.045);border-color:#dfe6f1}
.card:hover::after{transform:translate(45px,50px)}
.stats .card{min-height:132px}
.stat .value{letter-spacing:-.8px;transition:transform .3s ease,color .3s ease}
.stat:hover .value{transform:scale(1.035)}
.section-head h3{letter-spacing:-.15px}
.row{transition:background .25s ease,transform .25s ease,padding-inline .25s ease;border-radius:12px}
.row:hover{background:linear-gradient(90deg,rgba(240,244,255,.45),rgba(255,255,255,.2));transform:translateX(-2px);padding-inline:8px}
.primary,.secondary,.danger,.iconbtn,.tab,.linkbtn{
  transition:transform .2s ease,box-shadow .22s ease,background .22s ease,border-color .22s ease,color .22s ease;
}
.primary{box-shadow:0 8px 18px rgba(36,99,235,.15);position:relative;overflow:hidden}
.primary::before{content:"";position:absolute;inset:-40% auto -40% -65%;width:42%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.48),transparent);transition:left .55s ease}
.primary:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(36,99,235,.2)}
.primary:hover::before{left:125%}
.secondary:hover,.iconbtn:hover,.tab:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,43,75,.06)}
.danger:hover{transform:translateY(-2px)}
button:active{transform:translateY(1px) scale(.985)!important}
.search,.field input,.field select,.field textarea,.month-pick input,.month-pick button{transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}
.search:focus,.field input:focus,.field select:focus,.field textarea:focus{transform:translateY(-1px)}
.progress{box-shadow:inset 0 1px 2px rgba(31,43,75,.06)}
.bar{box-shadow:0 0 18px rgba(36,99,235,.25);animation:progressIn .9s .22s cubic-bezier(.2,.75,.2,1) both}
.badge{transition:transform .22s ease;}
.row:hover .badge{transform:translateY(-1px)}
.modal-wrap{opacity:0;pointer-events:none;backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);transition:opacity .25s ease,backdrop-filter .25s ease,-webkit-backdrop-filter .25s ease}
.modal-wrap.show{opacity:1;pointer-events:auto;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.modal{transform:translateY(18px) scale(.97);opacity:0;transition:transform .36s cubic-bezier(.16,.8,.2,1),opacity .25s ease;box-shadow:0 30px 100px rgba(16,24,40,.22),0 8px 28px rgba(36,99,235,.06)}
.modal-wrap.show .modal{transform:translateY(0) scale(1);opacity:1}
.toast{display:block;opacity:0;pointer-events:none;transform:translateY(14px) scale(.96);transition:opacity .25s ease,transform .3s cubic-bezier(.2,.75,.2,1)}
.toast.show{opacity:1;transform:translateY(0) scale(1);animation:none}
.empty{animation:fadeUp .45s ease both}
.hint{animation:softIn .55s ease both}
.kpi-line{transition:transform .25s ease}.kpi-line:hover{transform:translateX(-3px)}
#view{min-height:calc(100vh - 110px);animation:viewIn .5s cubic-bezier(.2,.75,.2,1) both}
.view-exit{animation:viewOut .22s ease both}
.stagger > *{--delay:calc(var(--i,0) * 70ms);animation-delay:var(--delay)!important}
.quick-glow{animation:quickGlow 2.4s ease-in-out infinite}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .55s ease-out forwards}
@keyframes appIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes titleIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes toolsIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes viewOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes softIn{from{opacity:0;filter:blur(3px);transform:translateY(5px)}to{opacity:1;filter:none;transform:none}}
@keyframes progressIn{from{width:0}to{width:var(--progress-width,100%)}}
@keyframes logoPulse{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-2px) rotate(-1.5deg)}}
@keyframes floatBlobA{from{transform:translate3d(0,0,0)}to{transform:translate3d(35px,-22px,0)}}
@keyframes floatBlobB{from{transform:translate3d(0,0,0)}to{transform:translate3d(-28px,25px,0)}}
@keyframes quickGlow{0%,100%{box-shadow:0 8px 18px rgba(36,99,235,.15)}50%{box-shadow:0 12px 30px rgba(36,99,235,.25)}}
@keyframes ripple{to{transform:scale(5);opacity:0}}
@media(max-width:1000px){.app{grid-template-columns:86px 1fr}.main{padding-inline:18px}.card:hover{transform:translateY(-2px)}}
@media(max-width:720px){.main{padding:12px 12px 24px}.topbar{padding-top:4px}.card:hover{transform:none}.sidebar{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.card:hover{transform:none}}

.modal-wrap{background:rgba(34,43,50,.30)}
.modal{background:#fffdf8}
.brand-hero{display:flex;align-items:center;gap:18px;margin-bottom:16px;padding:15px 17px;border:1px solid #e7d8ba;border-radius:22px;background:linear-gradient(135deg,rgba(255,253,247,.98),rgba(240,247,244,.96));box-shadow:0 14px 34px rgba(69,57,39,.07);overflow:hidden;position:relative}
.brand-hero::after{content:"";position:absolute;inset:auto -50px -80px auto;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(215,162,58,.16),transparent 70%);pointer-events:none}
.brand-hero-logo{width:96px;height:96px;flex:0 0 auto;border-radius:24px;overflow:hidden;background:#fff;border:1px solid rgba(215,162,58,.28);box-shadow:0 10px 25px rgba(69,57,39,.12)}
.brand-hero-logo img{width:100%;height:100%;display:block;object-fit:cover}
.brand-hero-title{font-size:27px;font-weight:950;color:var(--primary);letter-spacing:-.5px}
.brand-hero-sub{font-size:14px;font-weight:800;color:var(--gold);margin-top:1px}
.brand-hero-note{font-size:12px;color:var(--muted);margin-top:5px;max-width:620px}
.topbar{background:linear-gradient(180deg,rgba(247,243,234,.97) 60%,rgba(247,243,234,0));}
@media(max-width:720px){.brand-hero{padding:11px 12px;gap:12px}.brand-hero-logo{width:72px;height:72px;border-radius:19px}.brand-hero-title{font-size:22px}.brand-hero-note{font-size:11px}.brand-hero-sub{font-size:12px}}
</style>

<script>
(() => {
  'use strict';
  const KEY='bayti_home_manager_v1';
  const NAV=[['home','🏠','الرئيسية'],['money','💰','فلوس الشهر'],['shopping','🛒','ناقص البيت'],['upcoming','🔔','فكريني'],['more','⋯','أخرى']];
  const TYPES={essential:'أساسي',extra:'إضافي',emergency:'طارئ'};
  const TYPE_BADGE={essential:'b-essential',extra:'b-extra',emergency:'b-emergency'};
  const uid=()=>Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
  const pad2=n=>String(n).padStart(2,'0');
  const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`};
  const currentMonth=()=>todayISO().slice(0,7);
  const parseMonth=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1)};
  const monthLabel=m=>new Intl.DateTimeFormat('ar-EG',{month:'long',year:'numeric'}).format(parseMonth(m));
  const fmt=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:2}).format(Number(n||0))+' ج';
  const dateLabel=d=>d?new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'short',year:'numeric'}).format(new Date(d+'T00:00:00')):'';
  const clone=x=>JSON.parse(JSON.stringify(x));
  function defaultState(){return {version:1,selectedView:'home',month:currentMonth(),transactions:[],reminders:[],shopping:[],budgets:{},notes:[],trash:[],settings:{currency:'ج',defaultType:'essential'},family:[{id:'mom',name:'ماما',active:true}],history:[]};}
  let state=load();
  state.settings=state.settings||{};
  state.settings.notifications=Object.assign({enabled:false,leadMinutes:0,shoppingEnabled:true,overdueEnabled:true,lastCheck:null},state.settings.notifications||{});
  state.reminders=(state.reminders||[]).map(r=>Object.assign({time:'09:00',notifyEnabled:true,notifyCount:1,notifyEveryMinutes:60},r));
  state.notificationLog=state.notificationLog||{};
  state.shopping=(state.shopping||[]).map(x=>Object.assign({lastPurchasedAt:null,remindAfterDays:0,nextReminderDate:null,purchaseCount:0,lastPrice:0},x));
  let undoStack=[], redoStack=[];
  const $=id=>document.getElementById(id);
  function load(){try{const s=JSON.parse(localStorage.getItem(KEY)); return s?normalize(s):defaultState()}catch(e){return defaultState()}}
  function normalize(s){const d=defaultState(); return Object.assign(d,s,{transactions:Array.isArray(s.transactions)?s.transactions:[],reminders:Array.isArray(s.reminders)?s.reminders:[],shopping:Array.isArray(s.shopping)?s.shopping:[],budgets:s.budgets||{},notes:Array.isArray(s.notes)?s.notes:[],trash:Array.isArray(s.trash)?s.trash:[],settings:Object.assign(d.settings,s.settings||{}),family:Array.isArray(s.family)&&s.family.length?s.family:d.family,history:Array.isArray(s.history)?s.history:[]})}
  function persist(push=true){if(push){undoStack.push(clone(state)); if(undoStack.length>40)undoStack.shift(); redoStack=[]} localStorage.setItem(KEY,JSON.stringify(state));}
  function commit(fn){const snap=clone(state); fn(); undoStack.push(snap); if(undoStack.length>40)undoStack.shift(); redoStack=[]; localStorage.setItem(KEY,JSON.stringify(state)); render();}
  function undo(){if(!undoStack.length){toast('لا توجد خطوة للتراجع');return} redoStack.push(clone(state)); state=undoStack.pop(); localStorage.setItem(KEY,JSON.stringify(state));render();toast('تم التراجع')}
  function redo(){if(!redoStack.length){toast('لا توجد خطوة للإعادة');return} undoStack.push(clone(state)); state=redoStack.pop(); localStorage.setItem(KEY,JSON.stringify(state));render();toast('تمت الإعادة')}
  function toast(msg){const t=$('toast'); t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
  function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]))}
  function setView(v){state.selectedView=v;persist(false);render()}
  let notificationRegistration=null;
  const notificationPermission=()=>('Notification' in window?Notification.permission:'unsupported');
  const secureNotifications=()=>window.isSecureContext===true;
  async function registerServiceWorker(){if(!('serviceWorker' in navigator)||!secureNotifications())return null;try{notificationRegistration=await navigator.serviceWorker.register('./sw.js');return notificationRegistration}catch(e){return null}}
  async function showSystemNotification(title,body,tag='bayti'){if(notificationPermission()!=='granted')return false;try{if(!notificationRegistration)notificationRegistration=await registerServiceWorker();if(notificationRegistration?.showNotification){await notificationRegistration.showNotification(title,{body,tag,dir:'rtl',lang:'ar',icon:'./icon-192.png',badge:'./icon-192.png',data:{url:'./'}});return true}}catch(e){}return false}
  async function requestNotifications(){if(!('Notification' in window)){toast('الإشعارات غير مدعومة على هذا الجهاز');return}if(!secureNotifications()){toast('الإشعارات تحتاج HTTPS أو تثبيت البرنامج كتطبيق');return}try{const r=await Notification.requestPermission();if(r!=='granted'){toast(r==='denied'?'تم رفض الإشعارات من إعدادات المتصفح':'لم يتم تفعيل الإشعارات');return}state.settings.notifications.enabled=true;persist(false);await registerServiceWorker();await showSystemNotification('دار مها جاهز للتذكير','تم تفعيل إشعارات البيت.','bayti-test');render()}catch(e){toast('تعذر تشغيل الإشعارات')}}
  const notificationStatusText=()=>notificationPermission()==='granted'&&state.settings.notifications.enabled?'✅ مفعلة':notificationPermission()==='denied'?'⛔ مرفوضة':notificationPermission()==='unsupported'?'ℹ️ غير مدعومة':'🔔 غير مفعلة';
  function daysFromToday(n){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+Number(n||0));return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`}
  function reminderOccurrenceKey(r){return `${r.id}:${r.date}:${r.time||'09:00'}`}
  function reminderNotificationPlan(r,now=new Date()){
    if(r.done||!r.date||r.notifyEnabled===false)return [];
    const time=r.time||'09:00';
    const base=new Date(`${r.date}T${time}:00`);
    const count=Math.max(1,Math.min(10,Number(r.notifyCount)||1));
    const every=Math.max(1,Math.min(1440,Number(r.notifyEveryMinutes)||60));
    const lead=Math.max(0,Number(state.settings.notifications.leadMinutes)||0);
    const first=new Date(base.getTime()-lead*60000);
    const plan=[];
    for(let i=0;i<count;i++){
      const at=new Date(first.getTime()+i*every*60000);
      plan.push({i,at});
    }
    return plan;
  }
  async function checkSmartNotifications(){

  function familyAnalysis(m=state.month){

  function upcomingView(){const arr=[...state.reminders].sort((a,b)=>a.date.localeCompare(b.date));const overdue=arr.filter(r=>!r.done&&r.date<todayISO()).length;return `<div class="grid two"><div class="card"><div class="section-head"><h3>القادم والمواعيد</h3><button class="primary" id="newReminder">➕ إضافة</button></div><div class="hint">أي حاجة مهمة ومش عايزة تنسيها، اكتبيها هنا. البرنامج يفكرك بيها في اليوم اللي تختاريه.</div>${overdue?`<div class="notice alert"><strong>⚠️ ${overdue} موعد متأخر</strong></div>`:''}${arr.length?arr.map(r=>`<div class="row"><div class="row-main"><div class="row-title">${r.done?'✅ ':(!r.done&&r.date<todayISO()?'⚠️ ':'🔔 ')}${esc(r.title)}</div><div class="row-sub">${dateLabel(r.date)} · ${r.time||'09:00'}${r.notifyEnabled===false?' · 🔕 بدون إشعار':` · 🔔 ${r.notifyCount||1}×`}${r.repeat!=='none'?' · '+({'weekly':'أسبوعي','monthly':'شهري','yearly':'سنوي'}[r.repeat]):''}${r.note?' · '+esc(r.note):''}</div></div><div class="actions"><button class="iconbtn" data-r-toggle="${r.id}">${r.done?'↩️':'✅'}</button><button class="iconbtn" data-r-edit="${r.id}">✏️</button><button class="iconbtn" data-r-delete="${r.id}">🗑️</button></div></div>`).join(''):'<div class="empty">مفيش مواعيد مضافة.</div>'}</div><div class="card notification-glow"><div class="section-head"><h3>📲 إشعارات الهاتف</h3><span class="status-pill">${notificationStatusText()}</span></div><div class="hint">شغلي الإشعارات، اختبريها، وحددي قبل الموعد بكام دقيقة.</div><div class="settings-grid" style="margin-top:12px"><div class="field"><label>إشعار إضافي قبل الموعد (اختياري)</label><select id="leadSelect"><option value="0">في موعده فقط</option><option value="60">قبل ساعة</option><option value="1440">قبل يوم</option><option value="2880">قبل يومين</option></select></div><div class="field"><label>تذكير حاجات البيت</label><select id="shopNotifySelect"><option value="1">مفعل</option><option value="0">متوقف</option></select></div></div><div class="actions" style="margin-top:12px"><button class="primary" id="enableNotifications">🔔 تشغيل</button><button class="secondary" id="testNotification">🧪 تجربة</button></div><div class="note" style="margin-top:10px">تقدري تختاري الساعة وعدد مرات التذكير لكل موعد. الإرسال المتكرر يعمل أثناء تشغيل التطبيق؛ وللتذكير أثناء إغلاقه تمامًا يلزم Push Server.</div></div></div>`}
  function shoppingView(){const open=state.shopping.filter(x=>!x.done),done=state.shopping.filter(x=>x.done);return `<div class="shopping-hero"><div class="shopping-add"><div><h3>🛒 ناقص البيت</h3><p>أي حاجة ناقصة اكتبي اسمها هنا. لما تشتريها اضغطي ✅ وخلاص.</p></div><button class="primary big-plus" id="newShopping" title="أضيفي حاجة ناقصة">＋</button></div><div class="shopping-count"><div><strong>${open.length}</strong><span>حاجة ناقصة الآن</span></div></div></div><div class="card"><input class="search" id="shopSearch" placeholder="اكتبي اسم الحاجة… مثل زيت أو مسحوق"/><div class="shopping-section-title"><h4>🛒 لسه ناقص</h4><span>${open.length?`عندك ${open.length} حاجات`: 'القائمة فاضية'}</span></div><div id="shopList">${open.length?open.map(shopRow).join(''):'<div class="empty"><div style="font-size:30px">✅</div>مفيش حاجات ناقصة حاليًا.<br><button class="primary" id="newShoppingEmpty" style="margin-top:10px">➕ أضيفي أول حاجة</button></div>'}</div><div class="shopping-section-title"><h4>✅ اتشرى</h4><span>${done.length} حاجات</span></div>${done.length?done.map(shopRow).join(''):'<div class="empty">أي حاجة تخلصي شراءها هتظهر هنا.</div>'}</div>`}

  function familyView(){const stats=familyStats();const byId=Object.fromEntries(stats.map(x=>[x.id,x]));const rows=(state.family||[]).map(f=>{const st=byId[f.id]||{expense:0};return `<div class="family-item"><div class="family-person"><div class="family-avatar">👤</div><div><div class="row-title">${esc(f.name)}</div><div class="row-sub">مصروفاته هذا الشهر: ${fmt(st.expense)}</div></div></div><div class="actions"><button class="iconbtn" data-family-edit="${f.id}" title="تعديل الاسم">✏️</button><button class="iconbtn" data-family-remove="${f.id}" ${f.id==='mom'?'disabled title="ماما الأساسية لا تُحذف"':''}>🗑️</button></div></div>`}).join('');return `<div class="grid two"><div class="card"><div class="section-head"><h3>👨‍👩‍👧‍👦 أفراد الأسرة</h3><button class="primary" id="addFamily">➕ إضافة فرد</button></div><div class="hint">عدد أفراد الأسرة الآن: <strong>${state.family.length}</strong> — ماما موجودة تلقائيًا. عند تسجيل أي مصروف اختاري «لِمين؟» أو اتركيه «البيت كله».</div><div class="family-list">${rows||'<div class="empty">لم تتم إضافة أفراد بعد.</div>'}</div><div class="note" style="margin-top:10px">يمكنك تغيير الاسم أو إزالة فرد لم تسجل له بيانات. البيانات القديمة لا تُمسح من نفسها.</div></div><div class="card"><div class="section-head"><h3>📊 مصروفات كل فرد</h3><span class="note">${monthLabel(state.month)}</span></div><div class="family-summary">${stats.filter(x=>x.id!=='__house').map(x=>`<div class="card"><div class="note">👤 ${esc(x.name)}</div><div class="value">${fmt(x.expense)}</div></div>`).join('')||'<div class="empty">أضيفي أفراد الأسرة ليظهر نصيب كل واحد.</div>'}</div><div class="hint" style="margin-top:12px">💡 «البيت كله» للمصاريف العامة مثل الكهرباء والأكل، أما مصروف الشخص نفسه فاختاري اسمه عند التسجيل.</div></div></div>`}
  function editFamily(id){const f=state.family.find(x=>x.id===id);if(!f)return;openModal('تعديل فرد الأسرة',`<div class="field"><label>الاسم *</label><input id="familyName" value="${esc(f.name)}"></div><div class="modal-footer"><button class="primary" id="saveFamily">حفظ</button><button class="secondary" id="cancelFamily">إلغاء</button></div>`,()=>{$('cancelFamily').onclick=closeModal;$('saveFamily').onclick=()=>{const name=$('familyName').value.trim();if(!name){toast('اكتبي الاسم');return}commit(()=>{f.name=name});closeModal();toast('تم تعديل الاسم')}})}

  function removeFamily(id){if(id==='mom')return;const f=state.family.find(x=>x.id===id);if(!f)return;const has=state.transactions.some(t=>t.personId===id);if(has){toast('لا يمكن حذف فرد لديه مصروفات محفوظة؛ عدّليه أو اتركيه في الأسرة للحفاظ على التاريخ');return}commit(()=>{state.family=state.family.filter(x=>x.id!==id)});toast('تم حذف الفرد')}
  function moreView(){return `<div class="grid three"><div class="card"><h3>🔎 البحث</h3><input class="search" id="globalSearch" placeholder="مثال: درس محمد / كهربا / مسحوق"/><div id="searchResults" class="empty">اكتبي كلمة للبحث في السنوات المحفوظة.</div></div><div class="card"><div class="section-head"><h3>👨‍👩‍👧‍👦 الأسرة</h3><button class="primary" id="openFamily">فتح</button></div><div class="kpi-line"><span>عدد أفراد الأسرة</span><strong>${state.family.length}</strong></div><div class="row-sub">ماما + باقي أفراد البيت. لكل شخص مصروفاته الخاصة، والمصاريف العامة تظل «البيت كله».</div><div class="card notification-glow"><div class="section-head"><h3>📲 إشعارات الهاتف</h3><span class="status-pill">${esc(notificationStatusText())}</span></div><div class="actions"><button class="primary" id="enableNotifications">🔔 تشغيل</button><button class="secondary" id="testNotification">🧪 تجربة</button></div><p class="note" style="margin-top:10px">تحتاج HTTPS أو تثبيت كتطبيق.</p></div><div class="card"><h3>📝 ملاحظات البيت</h3><button class="primary" id="newNote">➕ ملاحظة</button><div style="margin-top:8px">${state.notes.slice(0,8).map(n=>`<div class="row"><div class="row-main"><div class="row-title">${esc(n.text)}</div><div class="row-sub">${dateLabel(n.createdAt.slice(0,10))}</div></div></div>`).join('')||'<div class="empty">لا توجد ملاحظات.</div>'}</div></div></div><div class="card" style="margin-top:16px"><h3>⚙️ أدوات آمنة</h3><div class="actions"><button class="secondary" id="undo2">↩️ تراجع</button><button class="secondary" id="redo2">↪️ إعادة</button><button class="secondary" id="openTrash">🗑️ السلة</button><button class="secondary" id="export2">💾 نسخة احتياطية</button><button class="secondary" id="import2">📥 استرجاع</button></div><p class="note" style="margin-top:12px">البرنامج يحفظ تلقائيًا على هذا الجهاز. استخدمي النسخة الاحتياطية عند تغيير الجهاز أو قبل تعديلات كبيرة.</p></div>`}
  function animateView(){
    const view=$('view'); if(!view) return;
    view.classList.remove('view-exit');
    requestAnimationFrame(()=>{
      view.querySelectorAll('.card').forEach((el,i)=>{el.style.setProperty('--i',i);el.style.animationDelay=`${Math.min(i*70,420)}ms`;});
      view.querySelectorAll('.row').forEach((el,i)=>{el.style.setProperty('--i',i);el.style.animationDelay=`${Math.min(i*35,280)}ms`;});
      const bar=view.querySelector('.bar');
      if(bar){const width=bar.dataset.width||getComputedStyle(bar).width;bar.style.setProperty('--progress-width',width);bar.style.width='0%';requestAnimationFrame(()=>{bar.style.width=width;});}
    });
  }

  function filterTx(term='',filter='all'){const box=$('txList');if(!box)return;term=term.trim().toLowerCase();let tx=activeTx().filter(t=>filter==='all'||(filter==='income'?t.kind==='income':t.type===filter)).filter(t=>!term||(`${t.title} ${t.note||''}`.toLowerCase().includes(term)));box.innerHTML=tx.map(t=>txRow(t)).join('')||'<div class="empty">لا توجد نتائج.</div>';document.querySelectorAll('[data-edit-t]').forEach(b=>b.onclick=()=>editTx(b.dataset.editT));document.querySelectorAll('[data-delete-t]').forEach(b=>b.onclick=()=>deleteTx(b.dataset.deleteT))}
  function filterShop(term=''){const box=$('shopList');if(!box)return;term=term.toLowerCase();const open=state.shopping.filter(x=>!x.done&&x.title.toLowerCase().includes(term));box.innerHTML=open.map(shopRow).join('')||'<div class="empty">لا توجد نتائج.</div>';document.querySelectorAll('[data-s-toggle]').forEach(b=>b.onclick=()=>toggleShopping(b.dataset.sToggle));document.querySelectorAll('[data-s-edit]').forEach(b=>b.onclick=()=>{const s=state.shopping.find(x=>x.id===b.dataset.sEdit);if(s)addShopping(s)});document.querySelectorAll('[data-s-delete]').forEach(b=>b.onclick=()=>deleteShopping(b.dataset.sDelete))}
  function globalSearch(term){const box=$('searchResults');term=term.trim().toLowerCase();if(!term){box.className='empty';box.textContent='اكتبي كلمة للبحث في السنوات المحفوظة.';return}const tx=state.transactions.filter(t=>`${t.title} ${t.note||''}`.toLowerCase().includes(term)).slice(0,20);const rem=state.reminders.filter(r=>`${r.title} ${r.note||''}`.toLowerCase().includes(term)).slice(0,10);const sh=state.shopping.filter(s=>s.title.toLowerCase().includes(term)).slice(0,10);let html='';tx.forEach(t=>html+=`<div class="row"><div class="row-main"><div class="row-title">${esc(t.title)}</div><div class="row-sub">${dateLabel(t.date)} · ${t.kind==='income'?'دخل':TYPES[t.type]} · ${familyName(t.personId)}</div></div><strong>${t.kind==='income'?'+':'-'}${fmt(t.amount)}</strong></div>`);rem.forEach(r=>html+=`<div class="row"><div class="row-main"><div class="row-title">🔔 ${esc(r.title)}</div><div class="row-sub">${dateLabel(r.date)} · الساعة ${r.time||'09:00'}${r.notifyEnabled===false?' · بدون إشعار':''}</div></div></div>`);sh.forEach(s=>html+=`<div class="row"><div class="row-main"><div class="row-title">🛒 ${esc(s.title)}</div><div class="row-sub">كمية: ${esc(s.qty)}</div></div></div>`);box.className=html?'':'empty';box.innerHTML=html||'لا توجد نتائج.'}
  function changeMonth(delta){const d=parseMonth(state.month);d.setMonth(d.getMonth()+delta);state.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;persist(false);render()}
  function openTrash(){const items=state.trash;openModal('سلة المحذوفات',`${items.length?items.map((x,i)=>`<div class="row"><div class="row-main"><div class="row-title">${x.kind==='transaction'?'💸':x.kind==='reminder'?'📅':'🛒'} ${esc(x.item.title)}</div><div class="row-sub">حُذف ${dateLabel(x.deletedAt.slice(0,10))}</div></div><div class="actions"><button class="iconbtn" data-restore="${i}">↩️ استرجاع</button><button class="danger" data-delperm="${i}">حذف نهائي</button></div></div>`).join(''):'<div class="empty">السلة فاضية.</div>'}<div class="modal-footer"><button class="secondary" id="closeTrash">إغلاق</button></div>`,()=>{$('closeTrash').onclick=closeModal;document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const idx=Number(b.dataset.restore);const x=state.trash[idx];if(!x)return;commit(()=>{if(x.kind==='transaction')state.transactions.unshift(x.item);if(x.kind==='reminder')state.reminders.unshift(x.item);if(x.kind==='shopping')state.shopping.unshift(x.item);state.trash.splice(idx,1)});closeModal();toast('تم الاسترجاع')});document.querySelectorAll('[data-delperm]').forEach(b=>b.onclick=()=>{const idx=Number(b.dataset.delperm);commit(()=>state.trash.splice(idx,1));openTrash();toast('تم الحذف النهائي')})})}
  function exportData(){const payload={app:'دار مها — مدير البيت الذكي',version:1,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`bayti-backup-${todayISO()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('تم إنشاء النسخة الاحتياطية')}
  function importData(file){const reader=new FileReader();reader.onload=()=>{try{const p=JSON.parse(reader.result);if(!p.state||!p.state.transactions){throw new Error('bad')}const old=clone(state);state=normalize(p.state);undoStack.push(old);localStorage.setItem(KEY,JSON.stringify(state));render();toast('تم استرجاع النسخة')}catch(e){toast('النسخة غير صالحة')}};reader.readAsText(file)}
  $('exportBtn').onclick=exportData;$('importBtn').onclick=()=>$('importFile').click();$('trashBtn').onclick=openTrash;$('importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}if(e.key==='Escape')closeModal()});
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(!b || b.disabled || b.classList.contains('linkbtn')) return;
    const rect=b.getBoundingClientRect();
    const r=document.createElement('span'); r.className='ripple';
    const size=Math.max(rect.width,rect.height)*.55;
    r.style.width=r.style.height=size+'px';
    r.style.left=(e.clientX-rect.left-size/2)+'px';
    r.style.top=(e.clientY-rect.top-size/2)+'px';
    b.appendChild(r); setTimeout(()=>r.remove(),650);
  });
  (async()=>{await registerServiceWorker();setTimeout(checkSmartNotifications,450);setInterval(()=>{if(document.visibilityState==='visible')checkSmartNotifications()},60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkSmartNotifications()})})();
  render();
})();
</script>
</body>
